{% load giggertags static %}
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock title %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<link rel="stylesheet" href="{% static 'gigger/site.css' %}">

{# Page-specific styles #}
<style>
    @media only screen and (max-width: 1000px) {
        {% block mobilecss %}{% endblock mobilecss %}
    }

    {% block css %}{% endblock css %}
</style>

    dummy.value = text;

        dummy.contentEditable = true;
        dummy.readOnly = true;
        var range = document.createRange();

{% block js %}{% endblock js %}

</script>
</head>
<body>

    <header class="site-header">
        <a href="{% url 'home' %}" class="site-header-home" title="Home">🏠</a>
        <span class="site-header-title">Gigger</span>
        <span class="site-header-user">
            {% if current_player %}
                <a href="{% url 'me' %}">👤 {{ current_player }}</a>
            {% else %}
                <a href="{% url 'who_am_i' %}">Who are you?</a>
            {% endif %}
        </span>

    {% block content %}{% endblock content%}

</html>
