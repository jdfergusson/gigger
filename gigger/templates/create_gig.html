{% extends "base.html" %}
{% load giggertags %}

{% block title %}Create new gig{% endblock title %}

{% block content %}
<div class="form-page">
    <h1>Propose a new gig</h1>

    <form action="{% url "create_gig" %}" method="post">
        {% csrf_token %}

        <section class="form-section">
            {% include "form_field.html" with field=form.title %}
            {% include "form_field.html" with field=form.date %}
        </section>

        <div class="form-buttons">
            <input type="submit" value="Propose" class="btn-good">
            <button type="button" onclick="window.location.href='{% url 'gigs' %}';" class="btn-bad">Cancel</button>
        </div>
    </form>
</div>
{% endblock content %}
